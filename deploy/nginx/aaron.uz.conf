server {
  listen 80;
  listen [::]:80;
  server_name aaron.uz www.aaron.uz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://aaron.uz$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.aaron.uz;

  ssl_certificate /etc/letsencrypt/live/aaron.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aaron.uz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://aaron.uz$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name aaron.uz;

  ssl_certificate /etc/letsencrypt/live/aaron.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aaron.uz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/aaron-crm/web/dist;
  index index.html;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /health {
    proxy_pass http://127.0.0.1:3003/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    proxy_pass http://127.0.0.1:3003/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
